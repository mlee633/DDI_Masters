experiment:
  seed: 42
  split_type: cold_drug
  test_size: 0.2
  val_size: 0.1
  n_neg_per_pos: 1

data:
  data_dir: "C:/Users/minwo/Desktop/Dataset"
  chch_file: ChCh-Miner_durgbank-chem-chem.tsv
  ddinter_shards_glob: "ddinter_downloads_code_*.csv"
  decagon_file: ChChSe-Decagon_polypharmacy.csv
  drug_cyp_file: src/dataset/drug_cyp.tsv
  sep_chch: "\t"

# NEW: toggles
sources:
  use_chch: true      # DRUGBANK ONLY
  use_ddinter: false   # DDINTER ONLY
  use_decagon: false   # DECAGON ONLY
  use_cyp: true       # CYP ONLY
  use_atc: false      # add later if needed

output:
  dir: outputs

models:
  # baseline model toggles (required)
  use_rule: false
  use_ppmi: false
  use_logreg: false
  use_xgboost: false
  use_distmult: false
  use_rotate: false

  # MHDv2 parameters
  mhd_v2:
    emb_dim: 128
    lr: 0.001
    epochs: 40
    patience: 5
    lambda_sup: 1.0
